[package]
name = "ulua"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
measurements = ["ulua_compiler/measurements"]

[[example]]
name = "s3_measure"
required-features = ["measurements"]

[[example]]
name = "s4_measure"
required-features = ["measurements"]

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
ulua_compiler = { path = "../ulua_compiler" }

[build-dependencies]
cc.workspace = true

[dev-dependencies]
ulua_compiler = { path = "../ulua_compiler", features = ["test-output-limit"] }
