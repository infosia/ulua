[workspace]
members = ["crates/ulua_compiler", "crates/ulua", "crates/ulua_corpus"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "MIT"

[workspace.dependencies]
oxc_allocator = { git = "https://github.com/infosia/oxc", rev = "43ad6ed5043f524f78c16a2d874b5fc588942a15" }
oxc_ast = { git = "https://github.com/infosia/oxc", rev = "43ad6ed5043f524f78c16a2d874b5fc588942a15" }
oxc_parser = { git = "https://github.com/infosia/oxc", rev = "43ad6ed5043f524f78c16a2d874b5fc588942a15", default-features = false }
oxc_span = { git = "https://github.com/infosia/oxc", rev = "43ad6ed5043f524f78c16a2d874b5fc588942a15" }
cc = "=1.2.65"
